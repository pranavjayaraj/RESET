// Compose compiler stability configuration.
// https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
//
// Read-only Kotlin collection interfaces. We never mutate the instances we pass into
// composables (durations, reset words, orbit angles), so treat them as stable to keep
// composables that receive them skippable.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// Domain models live in the Compose-free :model module, so the compiler can't infer
// their stability from this module. They are immutable data classes — declare them stable.
com.reset.model.domain.model.*
